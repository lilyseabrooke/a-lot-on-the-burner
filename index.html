<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3eee2" />
    <meta name="description" content="A daily alchemy puzzle. Brew the potion with as few clues as you can." />
    <title>A Lot on the Burner</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap"
    />
    <script>
      // Apply the saved theme and House before first paint so there's no flash. Mirrors App.tsx.
      (function () {
        var s = {};
        try {
          s = (JSON.parse(localStorage.getItem('a-lot-on-the-burner:v1')) || {}).settings || {};
        } catch (e) {}
        var t = s.theme === 'light' || s.theme === 'dark' ? s.theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.house = s.house || 'scorpion';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#101118' : '#f3eee2');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
